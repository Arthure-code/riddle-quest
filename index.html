<!DOCTYPE html>
<html lang="fr-CA">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Cinq énigmes tirées au hasard, une étoile par bonne réponse.">
    <title>Jeu d'énigmes</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 75 75'%3E%3Ccircle cx='37.5' cy='37.5' r='37.5' fill='%23ffdd55'/%3E%3Cpolygon points='37.5,12 45,30 65,30 49,42 55,62 37.5,50 20,62 26,42 10,30 30,30' fill='%23fff'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="styles/main.css">
    <script defer src="js/enigmes.js"></script>
    <script defer src="js/main.js"></script>
</head>
<body>
    <header>
        <h1>Jeu d'énigmes</h1>
    </header>
    <main>
        <form class="formulaire" novalidate>
            <fieldset id="sectionEnigmes" class="formulaire__etape" aria-labelledby="titreEnigme">
                <legend id="titreEnigme"><h2>Énigmes</h2></legend>
                <div id="zoneEnigme">
                    <p id="enigmeCourante"></p>
                    <div class="zone-champ">
                        <label for="champReponseEnigme">Votre réponse</label>
                        <input id="champReponseEnigme" type="text" autocomplete="off">
                        <span id="commentaireEnigme" aria-live="polite"></span>
                    </div>
                    <button type="submit" id="boutonRepondre">Répondre</button>
                </div>

                <div class="listeEtoiles" id="listeEtoiles">
                    <img src="images/etoile.png" alt="étoile" id="etoileEnigme1" class="cacher">
                    <img src="images/etoile.png" alt="étoile" id="etoileEnigme2" class="cacher">
                    <img src="images/etoile.png" alt="étoile" id="etoileEnigme3" class="cacher">
                    <img src="images/etoile.png" alt="étoile" id="etoileEnigme4" class="cacher">
                    <img src="images/etoile.png" alt="étoile" id="etoileEnigme5" class="cacher">
                </div>
            </fieldset>
            <div id="finJeu" class="cacher">
                <h2>Bravo!</h2>
            </div>
        </form>
    </main>
</body>
</html>
